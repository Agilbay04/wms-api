spring.application.name=wms-api

spring.datasource.url=jdbc:postgresql://${WMS_DB_HOST:localhost}:${WMS_DB_PORT:5432}/${WMS_DB_NAME:wms}
spring.datasource.username=${WMS_DB_USERNAME}
spring.datasource.password=${WMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${WMS_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${WMS_DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.redis.host=${WMS_REDIS_HOST:localhost}
spring.data.redis.port=${WMS_REDIS_PORT:6379}
spring.data.redis.password=${WMS_REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=${WMS_CACHE_TTL:10m}

spring.mail.host=${WMS_MAIL_HOST:localhost}
spring.mail.port=${WMS_MAIL_PORT:1025}
spring.mail.username=${WMS_MAIL_USERNAME:}
spring.mail.password=${WMS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${WMS_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${WMS_MAIL_SMTP_STARTTLS:false}

server.port=${WMS_SERVER_PORT:8081}

app.jwt.secret=${WMS_JWT_SECRET}
app.jwt.access-token-ttl=${WMS_JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.refresh-token-ttl=${WMS_JWT_REFRESH_TOKEN_TTL:7d}
app.export-directory=${WMS_EXPORT_DIRECTORY:exports}
app.seed-admin.email=${WMS_SEED_ADMIN_EMAIL:}
app.seed-admin.name=${WMS_SEED_ADMIN_NAME:}
app.seed-admin.password=${WMS_SEED_ADMIN_PASSWORD:}
seeder.enable-db-setup=${SEEDER_ENABLE_DB_SETUP:false}
seeder.result-directory=${WMS_SEED_RESULT_DIRECTORY:seed-results}
