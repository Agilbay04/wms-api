services:
  wms-api:
    build:
      context: .
    env_file:
      - .env
    environment:
      WMS_SERVER_PORT: 8081
      WMS_EXPORT_DIRECTORY: /app/exports
      WMS_SEED_RESULT_DIRECTORY: /app/seed-results
    expose:
      - "8081"
    volumes:
      - ./exports:/app/exports
      - wms_seed_results:/app/seed-results
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - wms-api
    ports:
      - "${WMS_NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  wms_seed_results:
