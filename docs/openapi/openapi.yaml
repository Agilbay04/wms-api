openapi: 3.1.0
info:
  title: Warehouse Management API
  description: |
    API for warehouse operations, stock, approvals, reporting, and exports.

    Request and response JSON property names use snake_case. Successful responses use the common
    envelope `{success, code, message, data, errors}`. Errors use the same envelope with `success=false`,
    `data=null`, and field errors keyed by snake_case property names. Bean validation failures return 422.

    Paginated list endpoints accept optional `page` (default 1), `size` (default 10, maximum 100),
    `sort` (endpoint-supported field), `order` (`asc` or `desc`, default `desc`), and `search`.
    Authentication uses a bearer JWT. Inbound, outbound, transfer, and adjustment records follow
    draft -> submit -> approve/reject workflows; approval and rejection require their corresponding
    permission, and creators cannot review their own records. Workflow conflicts return 409 with a
    stable error code such as `*_NOT_REVIEWABLE`, `*_NOT_EDITABLE`, or `INSUFFICIENT_STOCK`; a creator
    attempting self-review receives 403 with a `*_SELF_REVIEW_FORBIDDEN` code.
  version: 1.0.0
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Reports
  description: "Query stock summaries, balances, and movement history."
- name: Audit trails
  description: Search audit records for warehouse operations.
- name: Products
  description: Maintain the product catalog.
- name: Warehouses
  description: Maintain warehouses and view warehouses accessible to the user.
- name: Product categories
  description: Maintain product categories.
- name: Authentication
  description: "Login, refresh, and revoke bearer tokens."
- name: Stock transfers
  description: Move stock between warehouse locations through approval workflows.
- name: Report exports
  description: "Queue report exports, inspect their status, and download completed\
    \ CSV files."
- name: Stock adjustments
  description: "Adjustment draft, review, and stock correction workflows."
- name: Inventory
  description: Query warehouse stock balances and stock movements.
- name: Outbounds
  description: Pick and dispatch stock through draft and approval workflows.
- name: Warehouse locations
  description: Maintain locations within a warehouse.
- name: Inbounds
  description: "Receive stock through draft, approval, and putaway workflows."
- name: Dashboard
  description: Warehouse stock and pending-work summaries.
