        "404":
          description: The requested resource was not found or is not visible to the
            caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: The request conflicts with current resource state or existing
            data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Request validation or workflow rules failed.
          content:
            application/json:
              schema:
